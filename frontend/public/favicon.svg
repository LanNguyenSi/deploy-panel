<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Deep-navy background (#0A0E14 = --bg-void literal; CSS vars are not available in favicons) -->
  <rect width="32" height="32" rx="7" fill="#0A0E14"/>
  <!-- Ascending signal bars — same motif as sidebar brand mark.
       Literal cyan #22D3EE (= --primary) used because favicons render outside the document. -->
  <!-- Short bar — left -->
  <rect x="4" y="21" width="6" height="7" rx="1.5" fill="#22D3EE"/>
  <!-- Medium bar — centre -->
  <rect x="13" y="14" width="6" height="14" rx="1.5" fill="#22D3EE"/>
  <!-- Tall bar — right -->
  <rect x="22" y="7" width="6" height="21" rx="1.5" fill="#22D3EE"/>
</svg>
