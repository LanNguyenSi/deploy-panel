# Fixed project name for the dev stack. Without an explicit `name:` Compose
# derives the project name from the current directory, so running this file
# from the prod app directory (`docker compose -f docker-compose.yml ...`)
# would join the prod project and mount the LIVE prod `pgdata` volume. A
# fixed name keeps dev's volumes (deploy-panel-dev_pgdata) separate no matter
# which directory the file is run from. docker-compose.prod.yml deliberately
# sets no name: the live prod stack's project name comes from its directory,
# and adding one there now would rename the project and orphan the live
# database volume.
name: deploy-panel-dev

services:
  db:
    image: postgres:16-alpine
    ports:
      # Publish the db to the host on 5433 (loopback only) so the documented
      # local-dev flow works: `make db-push` and `make dev` run prisma and the
      # backend on the host and connect via DATABASE_URL=...@localhost:5433
      # (see .env.example). Inside the compose network the backend still uses
      # db:5432. 5433 avoids colliding with a host-local postgres on 5432.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deploy_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deploy_panel}
      POSTGRES_DB: ${POSTGRES_DB:-deploy_panel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deploy_panel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deploy_panel}:${POSTGRES_PASSWORD:-deploy_panel}@db:5432/${POSTGRES_DB:-deploy_panel}
      PORT: 3001
      # Reserved: nothing reads it today and startup does not require it.
      # When set it must be at least 16 characters; empty counts as unset.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Deliberately NO fallback default (unlike the optional vars here): a
      # committed placeholder here would mean every fresh clone that never
      # sets APP_SECRETS_KEY encrypts app secrets at rest with a key anyone
      # can read in this repo's history. With no default, an unset host var
      # substitutes to "" (Compose has no way to omit a listed `environment:`
      # key), which fails zod's min(16) check at backend startup and refuses
      # to boot — fail closed. Generate one with `openssl rand -hex 32` and
      # set it in .env before running `docker compose up` (see .env.example
      # / docs/configuration.md#app-secrets).
      APP_SECRETS_KEY: ${APP_SECRETS_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      # Optional: relay app name the panel is registered under (default
      # deploy-panel); the stuck-deploy sweep matches it by app name only.
      PANEL_SELF_APP_NAME: ${PANEL_SELF_APP_NAME:-}
      # PANEL_TOKEN is deliberately NOT forwarded here: an empty value fails
      # config validation (min 1) and production requires a token, so an
      # empty default would break startup without a token. Pass it through
      # an override file (see docker-compose.ci.yml) or use
      # docker-compose.prod.yml.
      # Optional: gates both GitHub paths, the identity-broker register
      # endpoint and the native OAuth callback. Empty = any verified GitHub
      # user (back-compat); set it to restrict.
      ALLOWED_GITHUB_LOGINS: ${ALLOWED_GITHUB_LOGINS:-}
      # Optional native GitHub OAuth. Empty = disabled (routes 503, frontend
      # hides the button). Set both ID and secret to enable; BACKEND_URL must
      # then be the public backend origin so the callback URL resolves.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
    healthcheck:
      # Same timing as the HEALTHCHECK in backend/Dockerfile (guarded by
      # backend/tests/dockerfile-healthcheck.test.ts); keep them in sync.
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 4
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      HOSTNAME: 0.0.0.0
    restart: unless-stopped

volumes:
  pgdata:
