name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate --schema=backend/prisma/schema.prisma
      - run: npm run typecheck --workspace=backend

  backend-test:
    # Runs the backend vitest suite (SSRF guard, app-name validation,
    # ownership/auth middleware, host-key pinning, post-deploy gate, …).
    # These backend test files are the repo's real behavioral safety
    # net; before this job they existed but never ran in CI, so a PR
    # could break SSRF or auth logic and still merge green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The suite imports the generated Prisma client; generate it first
      # (mirrors backend-typecheck) so the run does not fail on a missing
      # @prisma/client.
      - run: npx prisma generate --schema=backend/prisma/schema.prisma
      - run: npm run test --workspace=backend

  mcp-test:
    # The mcp/ package (@deploy-panel/mcp) is a standalone ESM package with
    # its own package.json/lockfile, not a root npm workspace, so it needs
    # its own checkout + install rather than `--workspace=mcp`. Covers the
    # MCP tool handlers' zod arg schemas, exact request construction
    # (server/app -> URL/body mapping — a swap here would deploy or roll
    # back the WRONG app), and error wrapping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: mcp
      - run: npm test
        working-directory: mcp

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck --workspace=frontend

  frontend-test:
    # Runs the frontend vitest suite (jsdom). Covers src/lib/status.ts and
    # src/lib/api.ts's request-construction (a swapped serverId/name would
    # deploy, roll back, tag, or delete the WRONG app) plus ConfirmDialog,
    # the confirm gate every destructive action (deploy/rollback/hide/
    # delete) funnels through — a broken gate would let a cancelled action
    # run anyway. Frontend is a root workspace, so root `npm ci` installs
    # it; no separate lockfile/cache-path needed (unlike the mcp package).
    #
    # Node 22 is the CI pin and reference; Node 26 exists so the webstorage
    # execArgv guard in frontend/vitest.config.ts stays falsifiable
    # (localStorage is a broken global there, so deleting the guard turns
    # only that leg red).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test --workspace=frontend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Forbid next/font/google
        # Fonts are vendored in frontend/src/fonts and loaded via
        # next/font/local; next/font/google makes `next build` depend on
        # fonts.googleapis.com being reachable and well-formed.
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.mjs' --exclude-dir=node_modules --exclude-dir=.next 'next/font/google' frontend; then
            echo "next/font/google is forbidden, vendor the font and use next/font/local" >&2
            exit 1
          fi
      - run: npm run build --workspace=frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build

  migrations:
    # The committed Prisma migrations (backend/prisma/migrations) are what
    # production applies at every backend start (backend/scripts/migrate.sh,
    # prisma migrate deploy), so this job runs that script against a real
    # Postgres: a fresh database, a second run, a database from before
    # migrations (schema applied by prisma db push) that is baselined, and one
    # that differs and must be left untouched. The shell test then covers the
    # entrypoint's retry loop and the remaining outcomes.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deploy_panel
      PGBASE: postgresql://postgres:postgres@localhost:5432
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deploy_panel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # An empty database takes the empty-database path, so this applies the
      # committed migrations with prisma migrate deploy.
      - name: Apply the committed migrations
        run: sh backend/scripts/migrate.sh

      # Fails when the committed migrations do not produce the schema that
      # schema.prisma describes: a schema change without a new migration
      # fails here.
      - name: Check migrations match schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel backend/prisma/schema.prisma --exit-code

      # A second start finds the migration history the first run wrote and
      # only runs prisma migrate deploy (nothing pending).
      - name: Migration step on a migrated database
        run: |
          out=$(sh backend/scripts/migrate.sh 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -qF "migrate: migration history found" <<< "$out" || { echo "the second run did not detect the migration history"; exit 1; }

      # A database from before migrations: the schema applied by prisma db
      # push (tables, no migration history) that matches schema.prisma. The
      # script records the baseline migration as applied, once, without running
      # it, and keeps the existing rows.
      - name: Baseline of a database from before migrations
        run: |
          psql "$PGBASE/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE legacy'
          export DATABASE_URL="$PGBASE/legacy"
          npx prisma db push --schema backend/prisma/schema.prisma --skip-generate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO servers (id, name, host, status, \"updatedAt\") VALUES ('s1', 'prod', 'prod.example.test', 'unknown', now())"
          out=$(sh backend/scripts/migrate.sh 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -qF "recording the baseline migration" <<< "$out" || { echo "the baseline was not recorded"; exit 1; }
          rows=$(psql "$DATABASE_URL" -At -c 'SELECT count(*) FROM _prisma_migrations')
          [ "$rows" = 1 ] || { echo "expected one _prisma_migrations row, got $rows"; exit 1; }
          servers=$(psql "$DATABASE_URL" -At -c 'SELECT count(*) FROM servers')
          [ "$servers" = 1 ] || { echo "the baseline changed the data: $servers servers, expected 1"; exit 1; }

      # A database from before migrations that differs from schema.prisma
      # (here: one extra column) must stop with exit 1 and leave the database
      # without a migration history and with its data.
      - name: A database from before migrations that differs is left untouched
        run: |
          psql "$PGBASE/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE drifted'
          export DATABASE_URL="$PGBASE/drifted"
          npx prisma db push --schema backend/prisma/schema.prisma --skip-generate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'ALTER TABLE servers ADD COLUMN legacy_note text'
          set +e
          out=$(sh backend/scripts/migrate.sh 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" = 1 ] || { echo "expected exit 1 for a differing database, got $rc"; exit 1; }
          grep -qF "differs from backend/prisma/schema.prisma" <<< "$out" || { echo "the refusal message is missing"; exit 1; }
          history=$(psql "$DATABASE_URL" -At -c "SELECT to_regclass('public._prisma_migrations') IS NOT NULL")
          [ "$history" = f ] || { echo "the script created a migration history on a differing database"; exit 1; }
          column=$(psql "$DATABASE_URL" -At -c "SELECT count(*) FROM information_schema.columns WHERE table_name = 'servers' AND column_name = 'legacy_note'")
          [ "$column" = 1 ] || { echo "the script changed the differing database"; exit 1; }

      # Every outcome of backend/scripts/migrate.sh and the entrypoint's retry
      # loop against the same server (each scenario uses its own database).
      - name: Migrate script and entrypoint tests
        env:
          MIGRATE_TEST_PG: postgresql://postgres:postgres@localhost:5432
        run: bash scripts/backend-migrate.test.sh

  smoke:
    # Runtime guard against the class of regression that caused the
    # 2026-04-12 production incident: silent schema drift between the
    # Prisma client and the live database. The static checks above
    # (typecheck, build, compose build) all pass for such a drift —
    # only a running stack + real DB-backed query catches it.
    #
    # Spins up db + backend from the PR's code, waits for health,
    # runs scripts/smoke-check.sh, and fails the job if any hard
    # check trips.
    #
    # Gated on the cheap static jobs so a typo doesn't burn ~4min of
    # docker build + compose bring-up before surfacing.
    needs: [backend-typecheck, backend-test, frontend-typecheck, frontend-build, docker, migrations]
    runs-on: ubuntu-latest
    env:
      # A throwaway token for the CI stack only. Never used outside
      # this runner — the backend restarts with this value for the
      # duration of the job and tears down immediately after.
      PANEL_TOKEN: ci-smoke-check-token-do-not-use-in-prod
    steps:
      - uses: actions/checkout@v5

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=deploy_panel
          POSTGRES_PASSWORD=ci_postgres_password
          POSTGRES_DB=deploy_panel
          SESSION_SECRET=ci-session-secret-long-enough-to-pass-min-16
          APP_SECRETS_KEY=ci-app-secrets-key-long-enough-to-pass-min-16
          NODE_ENV=production
          EOF

      - name: Start db + backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --build db backend

      - name: Wait for backend /api/health
        run: |
          # Poll /api/health every second for up to 120s. Cold start
          # on a loaded runner eats ~30s for next build alone, and the
          # entrypoint now runs `prisma migrate deploy` (backend/scripts/
          # migrate.sh, with retries) before Hono binds — give headroom. Healthy response exits early.
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy within 120s" >&2
          exit 1

      - name: Run smoke check
        env:
          DEPLOY_PANEL_URL: http://localhost:3001
        run: ./scripts/smoke-check.sh

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo '=== backend logs (last 500 lines) ==='
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=500 --no-color backend
          echo '=== db logs (last 500 lines) ==='
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=500 --no-color db

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  relay-config:
    # Parses .relay.yml with js-yaml the way agent-relay's loader reads it:
    # every pre_update/post_update entry must be a string, a hook key left
    # present with no items (null) is rejected, and no pre_update entry may
    # build images (pre_update runs pre-pull, so a build there builds the old
    # tree; the relay builds the pulled commit itself). Either mistake fails
    # every deploy on the server, so it fails CI first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/relay-config.test.sh
