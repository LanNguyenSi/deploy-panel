name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=backend/prisma/schema.prisma
      - run: npm run typecheck --workspace=backend

  backend-test:
    # Runs the backend vitest suite (SSRF guard, app-name validation,
    # ownership/auth middleware, host-key pinning, post-deploy gate, …).
    # These 18 files are the repo's real behavioral safety net; before
    # this job they existed but never ran in CI, so a PR could break
    # SSRF or auth logic and still merge green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The suite imports the generated Prisma client; generate it first
      # (mirrors backend-typecheck) so the run does not fail on a missing
      # @prisma/client.
      - run: npx prisma generate --schema=backend/prisma/schema.prisma
      - run: npm run test --workspace=backend

  mcp-test:
    # The mcp/ package (@deploy-panel/mcp) is a standalone ESM package with
    # its own package.json/lockfile, not a root npm workspace, so it needs
    # its own checkout + install rather than `--workspace=mcp`. Covers the
    # 6 MCP tool handlers' zod arg schemas, exact request construction
    # (server/app -> URL/body mapping — a swap here would deploy or roll
    # back the WRONG app), and error wrapping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=frontend

  frontend-test:
    # Runs the frontend vitest suite (jsdom). Covers src/lib/status.ts and
    # src/lib/api.ts's request-construction (a swapped serverId/name would
    # deploy, roll back, tag, or delete the WRONG app) plus ConfirmDialog,
    # the confirm gate every destructive action (deploy/rollback/hide/
    # delete) funnels through — a broken gate would let a cancelled action
    # run anyway. Frontend is a root workspace, so root `npm ci` installs
    # it; no separate lockfile/cache-path needed (unlike the mcp package).
    #
    # Node 22 is the CI pin and reference; Node 26 exists so the webstorage
    # execArgv guard in frontend/vitest.config.ts stays falsifiable
    # (localStorage is a broken global there, so deleting the guard turns
    # only that leg red).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=frontend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  smoke:
    # Runtime guard against the class of regression that caused the
    # 2026-04-12 production incident: silent schema drift between the
    # Prisma client and the live database. The static checks above
    # (typecheck, build, compose build) all pass for such a drift —
    # only a running stack + real DB-backed query catches it.
    #
    # Spins up db + backend from the PR's code, waits for health,
    # runs scripts/smoke-check.sh, and fails the job if any hard
    # check trips.
    #
    # Gated on the cheap static jobs so a typo doesn't burn ~4min of
    # docker build + compose bring-up before surfacing.
    needs: [backend-typecheck, backend-test, frontend-typecheck, frontend-build, docker]
    runs-on: ubuntu-latest
    env:
      # A throwaway token for the CI stack only. Never used outside
      # this runner — the backend restarts with this value for the
      # duration of the job and tears down immediately after.
      PANEL_TOKEN: ci-smoke-check-token-do-not-use-in-prod
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=deploy_panel
          POSTGRES_PASSWORD=ci_postgres_password
          POSTGRES_DB=deploy_panel
          SESSION_SECRET=ci-session-secret-long-enough-to-pass-min-16
          APP_SECRETS_KEY=ci-app-secrets-key-long-enough-to-pass-min-16
          NODE_ENV=production
          EOF

      - name: Start db + backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --build db backend

      - name: Wait for backend /api/health
        run: |
          # Poll /api/health every second for up to 120s. Cold start
          # on a loaded runner eats ~30s for next build alone, and the
          # entrypoint now runs `prisma db push` with retries before
          # Hono binds — give headroom. Healthy response exits early.
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy within 120s" >&2
          exit 1

      - name: Run smoke check
        env:
          DEPLOY_PANEL_URL: http://localhost:3001
        run: ./scripts/smoke-check.sh

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo '=== backend logs (last 500 lines) ==='
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=500 --no-color backend
          echo '=== db logs (last 500 lines) ==='
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=500 --no-color db

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
