# No top-level `name:` on purpose. The live prod stack's project name comes
# from the app directory on the server; setting or changing it here would
# start a new project with its own `<name>_pgdata` volume and orphan the live
# database. The dev file (docker-compose.yml) sets `name:` because it has no
# such constraint; see its comment.

# Log rotation for every prod service: capped json-file logs so a chatty
# container cannot fill the VPS disk (10 MB x 5 files per service).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    container_name: deploy-panel-db
    restart: unless-stopped
    logging: *default-logging
    # Generous headroom for a single-panel Postgres (no memory measurements
    # exist in this repo to size from); a hard cap so a runaway query or
    # connection storm cannot exhaust the host.
    mem_limit: 1g
    environment:
      POSTGRES_USER: deploy_panel
      # Fail closed: no fallback password (an old `:-` default shipped a
      # known password whenever the server .env lost the var).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: deploy_panel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploy_panel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: deploy-panel-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql://deploy_panel:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@deploy-panel-db:5432/deploy_panel
      PORT: 3001
      # Reserved: nothing reads it today and startup does not require it.
      # When set it must be at least 16 characters; empty counts as unset.
      SESSION_SECRET: ${SESSION_SECRET:-}
      PANEL_TOKEN: ${PANEL_TOKEN}
      # Encrypts per-app secrets at rest (see docs/configuration.md#app-secrets).
      # Required before any AppSecret is stored/read in production — the
      # backend throws rather than silently falling back to a weak dev key.
      APP_SECRETS_KEY: ${APP_SECRETS_KEY}
      CORS_ORIGINS: https://deploy-panel.opentriologue.ai
      FRONTEND_URL: https://deploy-panel.opentriologue.ai
      NODE_ENV: production
      # Optional: relay app name the panel is registered under (default
      # deploy-panel); the stuck-deploy sweep matches it by app name only.
      PANEL_SELF_APP_NAME: ${PANEL_SELF_APP_NAME:-}
      # Gates both GitHub paths: the identity-broker register endpoint and
      # the native OAuth callback. Fail closed here (no `:-` fallback): an
      # empty value means "any verified GitHub user", which must never be
      # the prod default. The backend default stays empty for dev.
      ALLOWED_GITHUB_LOGINS: ${ALLOWED_GITHUB_LOGINS:?ALLOWED_GITHUB_LOGINS must be set}
      # Native GitHub OAuth (pairs with #60 — standalone login). Empty =
      # disabled (routes 503, frontend hides button). Set all three in
      # prod .env to enable.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deploy-panel-api.rule=Host(`deploy-panel.opentriologue.ai`) && PathPrefix(`/api`)"
      - "traefik.http.routers.deploy-panel-api.entrypoints=websecure"
      - "traefik.http.routers.deploy-panel-api.tls=true"
      - "traefik.http.routers.deploy-panel-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.deploy-panel-api.loadbalancer.server.port=3001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://deploy-panel.opentriologue.ai
    container_name: deploy-panel-frontend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    depends_on:
      - backend
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deploy-panel.rule=Host(`deploy-panel.opentriologue.ai`)"
      - "traefik.http.routers.deploy-panel.entrypoints=websecure"
      - "traefik.http.routers.deploy-panel.tls=true"
      - "traefik.http.routers.deploy-panel.tls.certresolver=letsencrypt"
      - "traefik.http.services.deploy-panel.loadbalancer.server.port=3000"

volumes:
  pgdata:

networks:
  traefik:
    external: true
  internal:
