name: "Deploy Panel — Deploy"
description: "Deploy an app via Deploy Panel API with preflight checks and status polling"
branding:
  icon: "upload-cloud"
  color: "green"

inputs:
  url:
    description: "Deploy Panel URL (e.g. https://panel.example.com)"
    required: true
  api-key:
    description: "Deploy Panel API key (dp_...)"
    required: true
  server:
    description: "Server name or ID"
    required: true
  app:
    description: "App name"
    required: true
  preflight:
    description: "Run preflight checks before deploying (true/false)"
    required: false
    default: "true"
  force:
    description: "Force deploy even if preflight fails (true/false)"
    required: false
    default: "false"
  wait:
    description: "Wait for deploy to complete (true/false)"
    required: false
    default: "true"
  timeout:
    description: "Max seconds to wait for deploy completion"
    required: false
    default: "300"

outputs:
  deploy-id:
    description: "Deploy ID"
    value: ${{ steps.deploy.outputs.deploy_id }}
  status:
    description: "Deploy status: with wait true, the final status (success, failed, rolled_back, interrupted), timeout when the deploy did not finish within the timeout, or error when polling could not settle it (401/403 or an unexpected HTTP code); with wait false, running"
    value: ${{ steps.poll.outputs.status || steps.nowait.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Preflight checks
      if: inputs.preflight == 'true'
      id: preflight
      shell: bash
      env:
        PANEL_URL: ${{ inputs.url }}
        API_KEY: ${{ inputs.api-key }}
        SERVER: ${{ inputs.server }}
        APP: ${{ inputs.app }}
        FORCE: ${{ inputs.force }}
      run: |
        echo "::group::Preflight checks"
        RESULT=$(curl -sf -X POST "$PANEL_URL/api/v1/preflight" \
          -H "Authorization: Bearer $API_KEY" \
          -H "Content-Type: application/json" \
          -d "{\"server\": \"$SERVER\", \"app\": \"$APP\"}")

        echo "$RESULT" | jq -r '.checks[]? | "\(if .passed then "✅" else "❌" end) \(.name): \(.message)"' 2>/dev/null || echo "$RESULT"

        PASSED=$(echo "$RESULT" | jq -r '.passed // false')
        if [ "$PASSED" != "true" ] && [ "$FORCE" != "true" ]; then
          echo "::error::Preflight checks failed. Use force: true to deploy anyway."
          exit 1
        fi
        echo "::endgroup::"

    - name: Trigger deploy
      id: deploy
      shell: bash
      env:
        PANEL_URL: ${{ inputs.url }}
        API_KEY: ${{ inputs.api-key }}
        SERVER: ${{ inputs.server }}
        APP: ${{ inputs.app }}
        FORCE: ${{ inputs.force }}
      run: |
        RESULT=$(curl -sf -X POST "$PANEL_URL/api/v1/deploy" \
          -H "Authorization: Bearer $API_KEY" \
          -H "Content-Type: application/json" \
          -d "{\"server\": \"$SERVER\", \"app\": \"$APP\", \"force\": $FORCE}")

        DEPLOY_ID=$(echo "$RESULT" | jq -r '.deploy.id')
        echo "Deploy started: $DEPLOY_ID"
        echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

    - name: Wait for completion
      if: inputs.wait == 'true'
      id: poll
      shell: bash
      env:
        PANEL_URL: ${{ inputs.url }}
        API_KEY: ${{ inputs.api-key }}
        DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail

        # test harness knob: shrinks the backoff base so tests run instantly
        BASE="${DEPLOY_PANEL_ACTION_TEST_POLL_BASE:-10}"
        if ! [[ "$BASE" =~ ^[0-9]+$ ]]; then BASE=10; fi

        if ! [[ "${TIMEOUT:-}" =~ ^[0-9]+$ ]]; then
          echo "::error::timeout must be a number of seconds"
          echo "status=error" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        echo "Waiting for deploy $DEPLOY_ID (timeout ${TIMEOUT}s)..."

        SECONDS=0
        FAILED=0
        LAST_OUTCOME="no poll yet"
        MAX=$((3 * BASE))

        while [ "$SECONDS" -lt "$TIMEOUT" ]; do
          if ! BODY=$(curl -s --max-time 20 -w '\n%{http_code}' "$PANEL_URL/api/v1/deploy/$DEPLOY_ID" -H "Authorization: Bearer $API_KEY"); then
            BODY=""
            CODE=000
          else
            CODE="${BODY##*$'\n'}"
            BODY="${BODY%$'\n'*}"
          fi

          STATUS=""
          case "$CODE" in
            2??)
              if ! STATUS=$(printf '%s' "$BODY" | jq -r '.deploy.status // empty' 2>/dev/null); then
                STATUS=""
              fi
              ;;
          esac

          RETRY=0
          case "$CODE" in
            000|404|408|429|5??) RETRY=1 ;;
            2??) if [ -z "$STATUS" ]; then RETRY=1; fi ;;
            *)
              echo "status=error" >> "$GITHUB_OUTPUT"
              echo "::error::Deploy polling failed with HTTP $CODE"
              exit 1
              ;;
          esac

          LAST_OUTCOME="http $CODE, status ${STATUS:-none}"

          if [ "$RETRY" = "1" ]; then
            FAILED=$((FAILED + 1))
            DELAY=$((FAILED * BASE))
            if [ "$DELAY" -gt "$MAX" ]; then DELAY="$MAX"; fi
            echo "poll failed (http $CODE), retrying in ${DELAY}s"
            sleep "$DELAY"
            continue
          fi

          FAILED=0
          if [ "$STATUS" = "running" ]; then
            sleep "$BASE"
            continue
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          echo "::group::Deploy result"
          printf '%s' "$BODY" | jq -r '.deploy.steps[]? | "\(if .status == "success" then "✅" else "❌" end) \(.name) (\(.durationMs / 1000)s)"' 2>/dev/null || true
          echo "::endgroup::"

          if [ "$STATUS" = "success" ]; then
            echo "✅ Deploy successful"
            exit 0
          fi
          echo "::error::Deploy failed with status: $STATUS"
          exit 1
        done

        echo "status=timeout" >> "$GITHUB_OUTPUT"
        echo "::error::Deploy timed out after ${TIMEOUT}s (last poll: $LAST_OUTCOME)"
        exit 1

    - name: Set status (no-wait)
      if: inputs.wait != 'true'
      id: nowait
      shell: bash
      run: |
        echo "status=running" >> "$GITHUB_OUTPUT"
        echo "Deploy started (not waiting for completion)"
